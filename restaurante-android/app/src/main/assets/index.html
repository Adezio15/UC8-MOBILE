<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurante App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Bem-vindo(a)</p>
          <h1>Restaurante do Bairro</h1>
        </div>
      </header>

      <main class="content">
        <section class="menu-panel">
          <div class="section-header">
            <h2>Cardápio</h2>
            <span id="menuStatus">Selecione os itens</span>
          </div>
          <div id="menuList" class="menu-list"></div>
        </section>

        <aside class="cart-panel">
          <div class="section-header cart-header">
            <h2>Carrinho</h2>
            <button id="clearCartBtn" class="secondary-btn" type="button">Limpar</button>
          </div>

          <div id="cartItems" class="cart-items"></div>

          <div class="totals">
            <div class="total-row">
              <span>Itens</span>
              <strong id="itemCount">0</strong>
            </div>
            <div class="total-row grand-total">
              <span>Total</span>
              <strong id="totalAmount">R$ 0,00</strong>
            </div>
          </div>

          <button id="checkoutBtn" class="primary-btn" type="button">Finalizar pedido</button>
        </aside>
      </main>
    </div>

    <div id="orderModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Resumo do pedido</h3>
          <button id="closeModalBtn" class="icon-btn" type="button" aria-label="Fechar resumo">×</button>
        </div>

        <div id="modalSummary" class="modal-summary"></div>

        <div class="modal-footer">
          <button id="cancelOrderBtn" class="secondary-btn" type="button">Voltar</button>
          <button id="confirmOrderBtn" class="primary-btn" type="button">Confirmar pedido</button>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
