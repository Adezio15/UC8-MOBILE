<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=./aula1/" />
    <title>Restaurante App</title>
    <style>
      :root {
        --bg: #f6efe5;
        --panel: #fffaf7;
        --primary: #d94f2b;
        --text: #201a17;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #f6efe5 0%, #f7f3ef 100%);
        color: var(--text);
      }
      .loading {
        background: rgba(255,255,255,0.9);
        border: 1px solid #eadccf;
        border-radius: 22px;
        padding: 28px 32px;
        box-shadow: 0 18px 40px rgba(51, 28, 18, 0.08);
        text-align: center;
      }
      .loading strong {
        display: block;
        font-size: 1.3rem;
        margin-bottom: 8px;
        color: var(--primary);
      }
      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="loading">
      <strong>Carregando o app...</strong>
      <p>Se a página não abrir automaticamente, clique <a href="./aula1/">aqui</a>.</p>
    </div>
  </body>
</html>
